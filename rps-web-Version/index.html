<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Play Rock Paper Scissors online — free, fast, no install." />
  <title>Rock · Paper · Scissors</title>

  <!-- Favicon (SVG) -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --text: #e8e8f0;
      --muted: #8b8ba0;
      --rock: #e53e3e;
      --paper: #3182ce;
      --scissors: #38a169;
      --win: #48bb78;
      --lose: #fc8181;
      --tie: #ecc94b;
      --accent: #7c3aed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 560px;
      padding: 1.5rem 1rem 0.5rem;
      text-align: center;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .scoreboard {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .score-pill {
      background: var(--card);
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .score-pill strong {
      color: var(--text);
      font-size: 1.1rem;
    }

    .arena {
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1.5rem 1.25rem;
      width: 100%;
      text-align: center;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
    }

    .battle {
      font-size: 2rem;
      letter-spacing: 0.15em;
      min-height: 2.4rem;
    }

    .result {
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 1.6rem;
    }

    .result.win { color: var(--win); }
    .result.lose { color: var(--lose); }
    .result.tie { color: var(--tie); }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .choices {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .choice-btn {
      border: none;
      border-radius: 1rem;
      width: 100px;
      height: 100px;
      cursor: pointer;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: transform 0.12s ease, filter 0.12s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }

    .choice-btn:hover { transform: translateY(-3px); filter: brightness(1.08); }
    .choice-btn:active { transform: translateY(0); }
    .choice-btn .emoji { font-size: 1.75rem; line-height: 1; }

    .btn-rock { background: var(--rock); }
    .btn-paper { background: var(--paper); }
    .btn-scissors { background: var(--scissors); }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .secondary-btn {
      background: #2d3748;
      color: var(--text);
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.25rem;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .secondary-btn:hover { background: #3d4a5c; }

    /* ===== ADSENSE SLOT ===== */
    .ad-slot {
      width: 100%;
      max-width: 560px;
      margin: 0.5rem auto 1rem;
      padding: 0 1rem;
    }

    .ad-slot-inner {
      background: #16162a;
      border: 1px dashed #3a3a55;
      border-radius: 0.75rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 1rem;
    }

    /*
      Replace the .ad-slot-inner contents with your AdSense code, e.g.:

      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
           crossorigin="anonymous"></script>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="YYYYYYYYYY"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    */

    footer {
      width: 100%;
      max-width: 560px;
      padding: 0.75rem 1rem 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }

    footer a { color: #a78bfa; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>Rock · Paper · Scissors</h1>
    <p class="subtitle">Play vs computer · free · no account</p>
  </header>

  <main>
    <div class="scoreboard">
      <div class="score-pill">You <strong id="score-you">0</strong></div>
      <div class="score-pill">Ties <strong id="score-ties">0</strong></div>
      <div class="score-pill">CPU <strong id="score-cpu">0</strong></div>
    </div>

    <div class="arena">
      <div class="battle" id="battle"></div>
      <div class="result" id="result"></div>
      <p class="hint" id="hint">Pick Rock, Paper, or Scissors</p>
    </div>

    <div class="choices">
      <button type="button" class="choice-btn btn-rock" data-choice="r" aria-label="Rock">
        <span class="emoji">🪨</span>
        <span>Rock</span>
      </button>
      <button type="button" class="choice-btn btn-paper" data-choice="p" aria-label="Paper">
        <span class="emoji">📄</span>
        <span>Paper</span>
      </button>
      <button type="button" class="choice-btn btn-scissors" data-choice="s" aria-label="Scissors">
        <span class="emoji">✂️</span>
        <span>Scissors</span>
      </button>
    </div>

    <div class="actions">
      <button type="button" class="secondary-btn" id="reset-btn">Reset scores</button>
    </div>
  </main>

  <!-- ========== ADSENSE PLACEHOLDER ========== -->
  <aside class="ad-slot" aria-label="Advertisement">
    <div class="ad-slot-inner">
      <!-- PASTE YOUR ADSENSE CODE HERE -->
      Ad space — replace this box with your AdSense unit
    </div>
  </aside>
  <!-- ======================================== -->

  <footer>
    Free to play · Host anywhere static files work
  </footer>

  <script>
    const EMOJI = { r: "🪨", p: "📄", s: "✂️" };
    const NAME = { r: "Rock", p: "Paper", s: "Scissors" };

    let scores = { you: 0, cpu: 0, ties: 0 };

    const elYou = document.getElementById("score-you");
    const elCpu = document.getElementById("score-cpu");
    const elTies = document.getElementById("score-ties");
    const elBattle = document.getElementById("battle");
    const elResult = document.getElementById("result");
    const elHint = document.getElementById("hint");

    function isWin(player, opponent) {
      return (
        (player === "r" && opponent === "s") ||
        (player === "s" && opponent === "p") ||
        (player === "p" && opponent === "r")
      );
    }

    function updateScores() {
      elYou.textContent = scores.you;
      elCpu.textContent = scores.cpu;
      elTies.textContent = scores.ties;
    }

    function play(user) {
      const cpu = ["r", "p", "s"][Math.floor(Math.random() * 3)];
      elBattle.textContent = `${EMOJI[user]}  vs  ${EMOJI[cpu]}`;
      elHint.textContent = `You: ${NAME[user]} · Computer: ${NAME[cpu]}`;

      elResult.className = "result";
      if (user === cpu) {
        scores.ties += 1;
        elResult.textContent = "It's a tie!";
        elResult.classList.add("tie");
      } else if (isWin(user, cpu)) {
        scores.you += 1;
        elResult.textContent = "You won!";
        elResult.classList.add("win");
      } else {
        scores.cpu += 1;
        elResult.textContent = "You lost!";
        elResult.classList.add("lose");
      }
      updateScores();
    }

    document.querySelectorAll(".choice-btn").forEach((btn) => {
      btn.addEventListener("click", () => play(btn.dataset.choice));
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      scores = { you: 0, cpu: 0, ties: 0 };
      updateScores();
      elBattle.textContent = "";
      elResult.textContent = "";
      elResult.className = "result";
      elHint.textContent = "Pick Rock, Paper, or Scissors";
    });
  </script>
</body>
</html>
